<title>Naël — Grandir ensemble</title>
<style>
:root{--gold:#e9c788;--cream:#fff8ea;--muted:#aeb9cf;--card:rgba(255,255,255,.075);--line:rgba(233,199,136,.22);--danger:#ffb6b6;--ok:#8de0b2}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#050c1a;color:var(--cream)}
button,input,select,textarea{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 15% 8%,rgba(88,115,180,.2),transparent 28%),radial-gradient(circle at 88% 20%,rgba(233,199,136,.11),transparent 25%),linear-gradient(155deg,#09132a,#0d1b38 55%,#101f3c)}
.screen{max-width:520px;margin:auto;min-height:100vh;padding:22px 20px 116px}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding-bottom:50px}
.brand{font-family:Georgia,serif;color:var(--gold);font-size:56px;line-height:1}.tag{font-family:Georgia,serif;font-style:italic;color:#eadbbd;margin:9px 0}.scope,.muted{color:var(--muted)}.scope{letter-spacing:1.6px;font-size:11px;text-transform:uppercase;margin:6px 0 22px}
.logoOrb{width:174px;height:174px;border-radius:50%;display:grid;place-items:center;font-size:68px;background:radial-gradient(circle at 50% 35%,#31486d,#101b35 65%);border:1px solid rgba(233,199,136,.45);box-shadow:0 20px 65px rgba(0,0,0,.35);margin-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.homeBrand{font-family:Georgia,serif;color:var(--gold);font-size:34px}.pageTitle{font-family:Georgia,serif;font-size:35px;line-height:1.1;margin:0 0 9px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;margin:10px 0}.subtitle{color:var(--muted);line-height:1.5;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 48px rgba(0,0,0,.24);backdrop-filter:blur(14px)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{background:linear-gradient(135deg,#f1d79d,#d7ad68);color:#17203a}.secondary{background:transparent;color:var(--gold);border:1px solid var(--line)}.danger{background:rgba(255,150,150,.08);color:var(--danger);border:1px solid rgba(255,160,160,.22)}.success{background:rgba(141,224,178,.10);color:var(--ok);border:1px solid rgba(141,224,178,.25)}
.choice{display:flex;align-items:center;padding:18px;margin:14px 0;cursor:pointer}.choice .ico{width:58px;height:58px;border-radius:18px;background:rgba(233,199,136,.1);display:grid;place-items:center;font-size:30px;margin-right:14px}.choice h3{margin:0 0 6px}.choice p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}.chev{margin-left:auto;color:var(--gold);font-size:28px}
.hero{padding:22px;margin:14px 0 20px}.hero h2{font-family:Georgia,serif;font-size:26px;margin:4px 0 8px}.hero p{margin:0;color:#c2cce0;line-height:1.5}
.profileStrip{display:flex;align-items:center;padding:15px 16px;margin:12px 0 16px;cursor:pointer}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:29px;margin-right:12px;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.profileStrip b{display:block}.profileStrip small{color:var(--muted)}
.profileSwitcher{display:flex;gap:10px;overflow:auto;padding-bottom:4px;margin:0 0 18px}.switchChip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#c9d3e4}.switchChip.active{background:var(--gold);color:#18223c;font-weight:800}.switchChip .miniA{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;overflow:hidden}.switchChip .miniA img{width:100%;height:100%;object-fit:cover}
.sectionTitle{font-family:Georgia,serif;font-size:23px;margin:26px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module{padding:15px 7px;text-align:center;min-height:103px;cursor:pointer}.module .mi{display:block;font-size:29px;margin-bottom:8px}.module .ml{font-size:12px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px 8px;text-align:center}.stat b{display:block;font-size:22px;color:var(--gold)}.stat small{color:var(--muted)}
.list{display:flex;align-items:center;padding:15px;margin:10px 0;cursor:pointer}.li{font-size:28px;margin-right:13px}.list h3{margin:0 0 4px;font-size:16px}.list p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.right{margin-left:auto;color:var(--gold)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(8,18,40,.95);border-top:1px solid rgba(233,199,136,.15);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:20}.nav{background:transparent;border:0;color:#8fa0bf;padding:6px 2px}.nav span{display:block;font-size:20px}.nav small{font-size:10px}.nav.active{color:var(--gold)}
.back{border:0;background:transparent;color:var(--gold);padding:6px 0;font-weight:800;cursor:pointer}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:#e7edf7}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;outline:none}.field textarea{min-height:88px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#c1ccdf;border-radius:999px;padding:9px 13px;cursor:pointer}.chip.active{background:var(--gold);color:#17203a;font-weight:800}
.avatarChoices{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.avatarPick{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:26px;color:white;cursor:pointer}.avatarPick.active{outline:2px solid var(--gold);background:rgba(233,199,136,.12)}
.profileCard{display:flex;align-items:center;padding:14px;margin:10px 0}.profileCard .meta{flex:1}.profileCard h3{margin:0 0 5px}.profileCard p{margin:0;color:var(--muted);font-size:13px}.profileActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.mini{padding:8px 10px;border-radius:11px;font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#102548;border:1px solid var(--line);color:white;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{padding:14px;border-radius:16px;background:rgba(233,199,136,.07);border:1px solid var(--line);color:#d9e1ed;line-height:1.45;font-size:13px}.empty{padding:18px;text-align:center;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:rgba(233,199,136,.1);color:var(--gold);font-size:11px;font-weight:800}.rowBtns{display:flex;gap:10px;flex-wrap:wrap}.rowBtns .btn{flex:1}.notifDot{width:8px;height:8px;background:#ffcb6b;border-radius:50%;display:inline-block;margin-left:6px}
.quickbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.quick{padding:12px 8px;text-align:center}.quick span{font-size:22px;display:block;margin-bottom:5px}.quick small{font-weight:800;color:#dce5f2}
.summary{padding:18px}.summaryRow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.summaryRow:last-child{border-bottom:0}.summaryRow span:last-child{color:var(--gold);font-weight:800}
@media(min-width:700px){.screen{border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}}

.aiHero{padding:20px;background:linear-gradient(145deg,rgba(233,199,136,.13),rgba(90,120,190,.12));border:1px solid var(--line);border-radius:24px;margin:14px 0}.aiHero h2{font-family:Georgia,serif;font-size:26px;margin:6px 0}.aiInput{display:flex;gap:8px;margin:14px 0}.aiInput input{flex:1;padding:14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;outline:none}.answerBox{padding:16px;line-height:1.55}.answerBox b{color:var(--gold)}.sourceCard{padding:16px;margin:10px 0}.sourceCard a{color:var(--gold);text-decoration:none;font-weight:800}.sourceCard p{color:var(--muted);font-size:13px;line-height:1.45}.calendarDay{padding:14px;margin:9px 0}.calendarDate{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:1px}.calendarItems{margin-top:8px}.calendarItem{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.calendarItem:first-child{border-top:0}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:88px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(233,199,136,.45);background:linear-gradient(145deg,#f1d79d,#d7ad68);color:#17203a;font-size:30px;font-weight:700;box-shadow:0 14px 34px rgba(0,0,0,.35);z-index:25;cursor:pointer}.quickBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:28}.quickSheet{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);width:min(490px,calc(100% - 28px));padding:14px;background:#0d1d3b;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:29}.quickSheetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quickSheet button{padding:13px 8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:white;border-radius:15px}.quickSheet button span{display:block;font-size:24px;margin-bottom:5px}.night body,.night .app{background:#01040b!important}.night .app{background:radial-gradient(circle at 50% 0%,rgba(50,70,110,.11),transparent 25%),linear-gradient(160deg,#01040b,#050a14 55%,#060b15)!important}.night .card{background:rgba(255,255,255,.04)}.featureRow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.featureBtn{padding:15px 8px;text-align:center}.featureBtn span{display:block;font-size:26px;margin-bottom:7px}.featureBtn small{font-weight:800;color:#e8edf6}.searchResults{margin-top:12px}


.trackerHero{padding:18px;margin:14px 0}.trackerTime{font-family:Georgia,serif;font-size:42px;color:var(--gold);margin:8px 0}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.seg button{padding:11px 7px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#dce5f2}.seg button.active{background:var(--gold);color:#17203a;font-weight:800}.barChart{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:165px;padding:18px 12px 8px}.barCol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:70%;min-height:4px;border-radius:10px 10px 3px 3px;background:linear-gradient(180deg,#ead39e,#c79c5c)}.barVal{font-size:10px;color:var(--gold);font-weight:800}.barDay{font-size:10px;color:var(--muted)}.weekCards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.weekCard{padding:16px}.weekCard b{display:block;font-size:28px;color:var(--gold);margin-bottom:4px}.weekCard small{color:var(--muted)}.typePill{display:inline-flex;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:11px;font-weight:800;margin-right:6px}.inlineFields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.eventMeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.timerPulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8de0b2;margin-right:7px;box-shadow:0 0 0 5px rgba(141,224,178,.08)}


.docGrid,.memoryGrid,.checkGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.docCard,.memoryCard,.checkCard{padding:14px}.docCard h3,.memoryCard h3,.checkCard h3{margin:6px 0}.docMeta,.memoryMeta{font-size:12px;color:var(--muted)}.thumb{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);display:grid;place-items:center;margin-bottom:10px}.thumb img{width:100%;height:100%;object-fit:cover}.fileIcon{font-size:42px}
.checkItem{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}.checkItem:last-child{border-bottom:0}.checkItem input{margin-top:3px}.checkItem.done span{text-decoration:line-through;color:var(--muted)}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin:10px 0 2px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#e9c788,#c69b58);border-radius:999px}
.chartCard{padding:16px;margin:12px 0}.svgChart{width:100%;height:190px;display:block}.chartLabel{font-size:11px;fill:#aeb9cf}.chartLine{fill:none;stroke:#e9c788;stroke-width:3}.chartDot{fill:#fff8ea;stroke:#e9c788;stroke-width:2}.chartGrid{stroke:rgba(255,255,255,.08);stroke-width:1}.summaryHero{padding:20px;margin:14px 0}.summaryHero h2{font-family:Georgia,serif;font-size:26px;margin:6px 0}.summaryList{padding:16px}.summaryBullet{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.summaryBullet:last-child{border-bottom:0}.summaryBullet b{color:var(--gold)}
.badgeSoft{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;color:#dce5f2}


.connectCard{padding:18px;margin:12px 0}
.statusDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#8995ac}
.statusDot.ok{background:#8de0b2}.statusDot.off{background:#c68f8f}
.codeBox{padding:14px;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.04);font-family:ui-monospace,monospace;word-break:break-all;color:#f3deb0}
.familyMember{display:flex;align-items:center;gap:12px;padding:14px;margin:9px 0}
.familyMember .role{margin-left:auto;font-size:11px;color:var(--gold);font-weight:800}
.syncRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.syncRow:last-child{border-bottom:0}
.toggle{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.09);position:relative;border:1px solid var(--line)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#aeb9cf;transition:.2s}
.toggle.on{background:rgba(141,224,178,.15)}.toggle.on i{left:23px;background:#8de0b2}
.secureNote{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}

.authCard{padding:18px;margin:12px 0}.authStatus{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);margin:10px 0}
.accountRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.accountRow:last-child{border-bottom:0}
.smallNote{font-size:12px;color:var(--muted);line-height:1.5}

.cloudBadge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--gold);font-weight:800}
.mediaActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.syncTiny{font-size:11px;color:var(--muted);margin-top:6px}

.aiStatus{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--gold);margin-top:10px}
.aiStatusDot{width:8px;height:8px;border-radius:50%;background:#7fe0b4;box-shadow:0 0 0 4px rgba(127,224,180,.10)}
.aiSections{display:grid;gap:12px}
.aiSection{padding:15px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}
.aiSection h4{margin:0 0 7px;font-size:13px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.aiSourceList{display:grid;gap:10px;margin-top:12px}
.aiSource{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;background:rgba(255,255,255,.025)}
.aiSource b{display:block;margin-bottom:3px}
.aiSource small{color:var(--muted)}
.aiSafety{padding:13px 14px;border:1px solid rgba(237,196,121,.45);border-radius:16px;background:rgba(237,196,121,.08);margin-bottom:12px;font-weight:700;line-height:1.45}
.aiMeta{font-size:11px;color:var(--muted);margin-top:10px}

.realtimePill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:800}
.realtimePill:before{content:"";width:7px;height:7px;border-radius:50%;background:#7fe0b4}

.emergencyCard{border:1px solid rgba(237,196,121,.45);background:linear-gradient(180deg,rgba(237,196,121,.08),rgba(255,255,255,.025))}
.alertLine{display:grid;gap:5px;padding:13px 0;border-top:1px solid var(--line)}
.alertLine b{color:var(--gold)}
.reportSheet{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);line-height:1.5}
.reportSheet h1{margin-top:0}.reportSheet h2{margin-top:22px;font-size:17px}.reportDisclaimer{margin-top:25px;color:var(--muted);font-size:12px}
@media print{
 body{background:#fff!important;color:#111!important}
 .topbar,.bottomNav,.fab,.quickSheet,.quickBackdrop,.profileActions,.btn{display:none!important}
 .screen{max-width:none!important;padding:0!important}
 .reportSheet,.emergencyCard{border:none!important;background:#fff!important;color:#111!important;box-shadow:none!important}
 .muted,.reportDisclaimer{color:#444!important}
}

.activityGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.activityCard h3{margin:10px 0 7px}.activityCard p{line-height:1.45}
@media(max-width:720px){.activityGrid{grid-template-columns:1fr}}

.travelHero h2{font-size:30px;margin:8px 0}
.progressTrack{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.progressTrack span{display:block;height:100%;background:linear-gradient(90deg,#c7a667,#f0d79d);border-radius:inherit}

.homeAction span{font-size:27px}.homeAction b{font-size:14px}
.homeAction.accent{background:linear-gradient(145deg,rgba(233,199,136,.12),rgba(90,120,190,.12));border-color:rgba(233,199,136,.35)}
.compactLinks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.simpleMoreBtn{width:100%;margin-top:10px;padding:15px 2px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--gold);font-weight:800;text-align:left;display:flex;justify-content:space-between;cursor:pointer}

.simpleQuick{grid-template-columns:repeat(2,1fr)}
.featureRow,.grid{display:none!important}

.cloudIntro{margin-bottom:14px}

@media(max-width:420px){.languageGrid{grid-template-columns:1fr}}

/* ===== Naël V1.9 visual system ===== */
:root{
 --nael-bg:#07101d;--nael-bg-2:#0b1627;--nael-surface:#101d31;--nael-surface-2:#14233a;
