<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152e"><link rel="manifest" href="manifest.webmanifest"><title>Naël — Grandir ensemble</title><style>
:root{--bg:#061126;--bg2:#0d2346;--gold:#efce8b;--cream:#fffaf1;--muted:#c3cee0;--card:#ffffff12;--line:#efce8b44}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--cream);font-family:system-ui,sans-serif;min-height:100vh}#app{max-width:520px;margin:auto;padding:24px 18px 105px}header{display:flex;justify-content:space-between;align-items:center}h1{font:700 42px Georgia,serif;color:var(--gold);margin:0}header p{margin:3px 0 20px;color:var(--muted)}button,input,select,textarea{font:inherit}.hero,.card,.tool,.stats>div{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero,.card{padding:18px;margin:12px 0;box-shadow:0 10px 28px #0003}.hero h2,.page{font-family:Georgia,serif}.hero p,.card p,small{color:var(--muted)}.profile{display:flex;align-items:center;gap:12px}.profile>div:nth-child(2){flex:1}.profile strong,.profile small{display:block}.avatar{width:54px;height:54px;border-radius:50%;background:#ffffff10;display:grid;place-items:center;font-size:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool{color:var(--cream);min-height:98px;padding:12px;box-shadow:0 8px 22px #0003}.tool b{display:block;font-size:27px}.tool span{font-size:12px;font-weight:700}.primary,.ghost,.back,.danger{border:0;border-radius:13px;padding:12px 14px;font-weight:800}.primary{background:linear-gradient(135deg,#f0d89f,#d6aa65);color:#18233b;width:100%}.ghost,.back{background:transparent;color:var(--gold);border:1px solid var(--line)}.danger{background:#ffb3b315;color:#ffc0c0;border:1px solid #ffb3b333}.notice{margin:10px 0 14px;padding:13px 14px;border-radius:15px;background:#efce8b12;border:1px solid #efce8b40;color:#ffe5ad;font-weight:700}.page{margin-bottom:8px}label{display:block;font-size:12px;font-weight:800;margin:12px 0}input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:13px;border:1px solid var(--line);background:#ffffff0c;color:white}textarea{min-height:78px}.item{padding:12px 0;border-bottom:1px solid #ffffff12}.item strong,.item small{display:block}.calendar const KEY="nael.clean.v1";
const base={screen:"home",lang:"fr",profiles:[],active:null,events:[],growth:[],appointments:[],vaccines:[],reminders:[],aiMessages:[]};
let state;
try{state=Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){state=JSON.parse(JSON.stringify(base))}
const app=document.getElementById("app");
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function current(){return state.profiles.find(function(p){return p.id===state.active})||null}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(text,cls,fn){const b=node("button",cls,text);b.addEventListener("click",fn);return b}
function go(screen){state.screen=screen;save();render()}
function clear(){app.innerHTML=""}
function addNav(active){
 const nav=node("nav");
 [["home","⌂","Accueil"],["calendar","▦","Calendrier"],["feeding","+","Suivi"],["reminders","◉","Rappels"],["settings","⚙","Réglages"]].forEach(function(x){
   const b=button("",active===x[0]?"on":"",function(){go(x[0])});
   const big=node("b","",x[1]),small=node("span","",x[2]);b.append(big,small);nav.appendChild(b);
 });
 app.appendChild(nav);
}
function addField(parent,labelText,id,type,value){
 const l=node("label","",labelText),i=node("input");i.id=id;i.type=type||"text";i.value=value||"";l.appendChild(i);parent.appendChild(l);return i;
}
function age(d){if(!d)return"";const b=new Date(d),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();return m<24?m+" mois":Math.floor(m/12)+" ans"}
function home(){
 clear();
 const h=node("header"),wrap=node("div"),title=node("h1","","Naël"),sub=node("p","","Grandir ensemble");wrap.append(title,sub);h.append(wrap,button("⚙","ghost",function(){go("settings")}));app.appendChild(h);
 const p=current(),hero=node("section","hero");hero.append(node("h2","",p?"Bonjour, "+p.name+" ✨":"Bienvenue dans Naël ✨"),node("p","","Le compagnon parental doux et pratique au quotidien."));app.appendChild(hero);
 if(p){
   const c=node("section","card profile");const av=node("div","avatar",p.avatar||"👶"),mid=node("div");mid.append(node("strong","",p.name),node("small","",age(p.dob)));c.append(av,mid,node("span","",">"));c.addEventListener("click",function(){go("profile")});app.appendChild(c);
 }else{
   const c=node("section","card");c.append(node("strong","","Aucun profil enfant"),node("p","","Crée le premier profil pour commencer le suivi."),button("Créer un profil","primary",function(){go("profile")}));app.appendChild(c);
 }
 const tools=[["feeding","🍼","Alimentation"],["sleep","🌙","Sommeil"],["diapers","🧷","Couches"],["growth","📈","Croissance"],["appointments","🩺","Rendez-vous"],["vaccines","💉","Vaccins"],["reminders","🔔","Rappels"],["ai","✨","Naël AI"],["calendar","📅","Calendrier"],["settings","⚙️","Réglages"]];
 app.appendChild(node("h3","","Outils"));const grid=node("section","grid");
 tools.forEach(function(x){const b=button("","tool",function(){go(x[0])});b.append(node("b","",x[1]),node("span","",x[2]));grid.appendChild(b)});app.appendChild(grid);addNav("home");
}
function profile(){
 clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page","Profil enfant"));if(state.profileNotice){const n=node("section","notice",state.profileNotice);app.appendChild(n);delete state.profileNotice;save();}
 const c=node("section","card"),p=current()||{};
 addField(c,"Prénom","pn","text",p.name||"");addField(c,"Date de naissance","pd","date",p.dob||"");
 const l=node("label","","Avatar"),sel=node("select");sel.id="pa";["👶","🧸","🐰","🦁","🐼","🌙","⭐"].forEach(function(a){const o=node("option","",a);o.value=a;if(p.avatar===a)o.selected=true;sel.appendChild(o)});l.appendChild(sel);c.appendChild(l);
 addField(c,"Poids naissance (kg)","pw","text",p.birthWeight||"");addField(c,"Taille naissance (cm)","ph","text",p.birthHeight||"");addField(c,"Pédiatre / médecin","pdoc","text",p.doctor||"");
 const li=node("label","","Allergies / infos importantes"),ta=node("textarea");ta.id="pi";ta.value=p.info||"";li.appendChild(ta);c.appendChild(li);
 c.appendChild(button("Enregistrer","primary",function(){
   const name=document.getElementById("pn").value.trim();if(!name){alert("Prénom requis");return}
   let q=current();if(!q){q={id:uid()};state.profiles.push(q);state.active=q.id}
   q.name=name;q.dob=document.getElementById("pd").value;q.avatar=document.getElementById("pa").value;q.birthWeight=document.getElementById("pw").value;q.birthHeight=document.getElementById("ph").value;q.doctor=document.getElementById("pdoc").value;q.info=document.getElementById("pi").value;save();go("home");
 }));
 app.appendChild(c);addNav("");
}
function need(){if(current())return true;state.profileNotice="Crée d’abord un profil enfant pour utiliser ce module.";state.screen="profile";save();render();return false}
function tracking(type,title){
 if(!need())return;clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page",title));
 const c=node("section","card");
 if(type==="sleep"){addField(c,"Début","start","datetime-local","");addField(c,"Fin","end","datetime-local","");addField(c,"Note","note","text","")}
 else{const l=node("label","",type==="feeding"?"Type de repas":"Type"),s=node("select");s.id="kind";(type==="feeding"?["Biberon","Allaitement","Solides"]:["Pipi","Caca","Mixte"]).forEach(function(v){const o=node("option","",v);o.value=v;s.appendChild(o)});l.appendChild(s);c.appendChild(l);addField(c,"Note / quantité","note","text","")}
 c.appendChild(button("Enregistrer","primary",function(){
   const e={id:uid(),profileId:state.active,type:type,ts:new Date().toISOString()};
   if(type==="sleep"){const a=document.getElementById("start").value,b=document.getElementById("end").value;if(!a||!b){alert("Début et fin requis");return}e.duration=Math.round((new Date(b)-new Date(a))/60000);if(e.duration<=0){alert("Heures invalides");return}e.ts=new Date(b).toISOString();e.note=document.getElementById("note").value}
   else{e.kind=document.getElementById("kind").value;e.note=document.getElementById("note").value}
   state.events.push(e);save();tracking(type,title);
 }));app.appendChild(c);
 const list=node("section","card"),items=state.events.filter(function(e){return e.profileId===state.active&&e.type===type}).slice().reverse();
 if(!items.length)list.appendChild(node("p","","Aucun historique."));
 items.forEach(function(e){const it=node("div","item");it.append(node("strong","",new Date(e.ts).toLocaleString("fr-FR")),node("small","",(e.kind||"")+(e.duration?" • "+e.duration+" min":"")+(e.note?" • "+e.note:"")));list.appendChild(it)});app.appendChild(list);addNav(type);
}
function simple(title,key){
 if(!need())return;clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page",title));
 const c=node("section","card");addField(c,title==="Croissance"?"Poids (kg)":"Titre","v1","text","");addField(c,title==="Croissance"?"Taille (cm)":"Date / heure","v2",title==="Croissance"?"text":"datetime-local","");
 c.appendChild(button("Ajouter","primary",function(){if(key==="growth"){state.growth.push({id:uid(),profileId:state.active,weight:document.getElementById("v1").value,height:document.getElementById("v2").value,ts:new Date().toISOString()})}else{state[key].push({id:uid(),profileId:state.active,title:document.getElementById("v1").value,date:document.getElementById("v2").value})}save();simple(title,key)}));app.appendChild(c);
 const list=node("section","card"),items=state[key].filter(function(x){return x.profileId===state.active}).slice().reverse();if(!items.length)list.appendChild(node("p","","Aucun élément."));
 items.forEach(function(x){const it=node("div","item");it.append(node("strong","",key==="growth"?(x.weight||"—")+" kg • "+(x.height||"—")+" cm":x.title||"Sans titre"),node("small","",key==="growth"?new Date(x.ts).toLocaleDateString("fr-FR"):x.date||""));list.appendChild(it)});app.appendChild(list);addNav(key);
}
function calendar(){
 if(!need())return;clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page","Calendrier"));
 const c=node("section","card calendar");["L","M","M","J","V","S","D"].forEach(function(x){c.appendChild(node("b","",x))});
 const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<start;i++)c.appendChild(node("i"));
 for(let d=1;d<=days;d++){const x=node("div","day"+(d===n.getDate()?" today":""),String(d));c.appendChild(x)}app.appendChild(c);addNav("calendar");
}

 en:{name:"English",dir:"ltr",map:{
 "Grandir ensemble":"Growing together","Bienvenue dans Naël ✨":"Welcome to Naël ✨","Le compagnon parental doux et pratique au quotidien.":"A gentle and practical parenting companion for every day.","Aucun profil enfant":"No child profile","Crée le premier profil pour commencer le suivi.":"Create the first profile to start tracking.","Créer un profil":"Create profile","Outils":"Tools","Alimentation":"Feeding","Sommeil":"Sleep","Couches":"Diapers","Croissance":"Growth","Rendez-vous":"Appointments","Vaccins":"Vaccines","Rappels":"Reminders","Calendrier":"Calendar","Réglages":"Settings","Accueil":"Home","Suivi":"Tracking","Retour":"Back","Profil enfant":"Child profile","Prénom":"First name","Date de naissance":"Date of birth","Avatar":"Avatar","Poids naissance (kg)":"Birth weight (kg)","Taille naissance (cm)":"Birth height (cm)","Pédiatre / médecin":"Pediatrician / doctor","Allergies / infos importantes":"Allergies / important info","Enregistrer":"Save","Aucun historique.":"No history.","Aucun élément.":"No items.","Ajouter":"Add","Données enregistrées localement sur cet appareil.":"Data is stored locally on this device.","Réinitialiser les données":"Reset data","Confidentialité":"Privacy","Langue":"Language","Assistant parental intelligent":"Smart parenting assistant","Pose ta question à Naël AI":"Ask Naël AI","Envoyer":"Send","Naël AI":"Naël AI"

 }}
};
function translateVisibleText(){
 const cfg=LANGS[state.lang]||LANGS.fr;document.documentElement.lang=state.lang||"fr";document.documentElement.dir=cfg.dir||"ltr";
 if(state.lang==="fr")return;
 const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(function(n){const raw=n.nodeValue,trim=raw.trim();if(!trim)return;if(cfg.map[trim])n.nodeValue=raw.replace(trim,cfg.map[trim]);else if(trim.indexOf("Bonjour, ")===0)n.nodeValue=raw.replace(trim,(state.lang==="ar"?"مرحبًا، ":state.lang==="es"?"Hola, ":"Hello, ")+trim.slice(9));});
}
function aiScreen(){
 clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page","Naël AI"));
 const intro=node("section","card");intro.append(node("strong","","Assistant parental intelligent"),node("p","","Naël AI peut répondre à tes questions et utiliser le profil et le suivi enregistrés dans l’app comme contexte."));app.appendChild(intro);
 const chat=node("section","card aiChat");const msgs=state.aiMessages||[];if(!msgs.length)chat.appendChild(node("p","","Pose ta question à Naël AI"));
 msgs.forEach(function(m){const row=node("div","aiMsg "+m.role);row.textContent=m.text;chat.appendChild(row)});app.appendChild(chat);
 const box=node("section","card"),ta=node("textarea");ta.id="aiq";ta.placeholder="Pose ta question à Naël AI";box.appendChild(ta);
 box.appendChild(button("Envoyer","primary",async function(){
   const q=ta.value.trim();if(!q)return;state.aiMessages=state.aiMessages||[];state.aiMessages.push({role:"user",text:q});save();aiScreen();
   try{
     const p=current();const payload={message:q,language:state.lang||"fr",context:{child:p||null,events:state.events.slice(-30),growth:state.growth.slice(-10),appointments:state.appointments.slice(-10),vaccines:state.vaccines.slice(-10),reminders:state.reminders.slice(-10)}};
     const resp=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
     const data=await resp.json();state.aiMessages.push({role:"assistant",text:data.answer||data.error||"Naël AI indisponible."});
   }catch(e){state.aiMessages.push({role:"assistant",text:"Naël AI est momentanément indisponible."})}
   save();aiScreen();
 }));app.appendChild(box);addNav("");translateVisibleText();
}

function settings(){
 clear();app.append(button("← Retour","back",function(){go("home")}),node("h2","page","Réglages"));
 const c=node("section","card");c.append(node("strong","","Naël V0.5"),node("p","","Données enregistrées localement sur cet appareil."),button("Réinitialiser les données","danger",function(){if(confirm("Tout supprimer ?")){localStorage.removeItem(KEY);state=JSON.parse(JSON.stringify(base));render()}}));app.appendChild(c);const lc=node("section","card"),lab=node("label","","Langue"),sel=node("select");sel.id="lang";Object.keys(LANGS).forEach(function(k){const o=node("option","",LANGS[k].name);o.value=k;if((state.lang||"fr")===k)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",function(){state.lang=sel.value;save();settings()});lab.appendChild(sel);lc.appendChild(lab);app.appendChild(lc);const pc=node("section","card");pc.append(node("strong","","Confidentialité"),node("p","","Les données restent sur cet appareil sauf lorsque tu envoies volontairement une question à Naël AI."));app.appendChild(pc);addNav("settings");translateVisibleText();
}
function render(){const s=state.screen||"home";if(s==="home")home();else if(s==="profile")profile();else if(s==="feeding")tracking("feeding","Alimentation");else if(s==="sleep")tracking("sleep","Sommeil");else if(s==="diapers")tracking("diapers","Couches");else if(s==="growth")simple("Croissance","growth");else if(s==="appointments")simple("Rendez-vous","appointments");else if(s==="vaccines")simple("Vaccins","vaccines");else if(s==="reminders")simple("Rappels","reminders");else if(s==="ai")aiScreen();else if(s==="calendar")calendar();else if(s==="settings")settings();else{state.screen="home";render();return}translateVisibleText()}
render();
