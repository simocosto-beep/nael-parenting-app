<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<link rel="manifest" href="manifest.webmanifest">
<title>Naël — Grandir ensemble</title>
<style>
:root{--bg:#061022;--bg2:#0d1d3a;--gold:#e8c785;--cream:#fff8eb;--muted:#aebbd2;--card:rgba(255,255,255,.07);--line:rgba(232,199,133,.24);--danger:#ffb0b0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--cream);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}
#app{max-width:520px;min-height:100vh;margin:auto;padding:20px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:700 38px Georgia,serif;color:var(--gold)}.sub{color:var(--muted);margin:4px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 34px #0005}.hero{padding:20px}.hero h2,.title{font-family:Georgia,serif}.hero h2{margin:0 0 8px;font-size:26px}.title{font-size:30px;margin:12px 0}.muted{color:var(--muted)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#f1daa6,#d8ad69);color:#17213a}.ghost{background:transparent;border:1px solid var(--line);color:var(--gold)}.danger{background:#ffaaaa10;border:1px solid #ffaaaa33;color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mod{min-height:92px;text-align:center;display:grid;place-items:center;cursor:pointer}.mod b{display:block;font-size:28px}.mod span{font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center}.stat strong{display:block;font-size:22px;color:var(--gold)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:#ffffff0d;color:#fff}.field textarea{min-height:80px}.row{display:flex;gap:9px;flex-wrap:wrap}.row .btn{flex:1}.list{padding:13px;border-bottom:1px solid #ffffff12}.list:last-child{border-bottom:0}.list b{display:block}.list small{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:11px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px;background:#08152ef2;border-top:1px solid var(--line)}.bottom button{background:transparent;border:0;color:#aab7cd;padding:6px}.bottom button.active{color:var(--gold)}.bottom span{display:block;font-size:20px}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#ffffff10;font-size:28px}.profile{display:flex;align-items:center;gap:12px}.grow{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:50px;border:1px solid #ffffff10;border-radius:12px;padding:5px;font-size:11px}.day.today{outline:1px solid var(--gold)}.dot{width:6px;height:6px;background:var(--gold);border-radius:50%;display:inline-block;margin:2px}.chart{height:170px;display:flex;align-items:end;gap:8px;padding:10px}.bar{flex:1;background:linear-gradient(#f0d59b,#b9894b);border-radius:8px 8px 2px 2px;min-height:5px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10264b;border:1px solid var(--line);padding:10px 14px;border-radius:12px;opacity:0;transition:.2s}.toast.show{opacity:1}.empty{text-align:center;color:var(--muted);padding:18px}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const K="nael.state.v05.web";
const D={screen:"home",profiles:[],active:null,events:[],appointments:[],vaccines:[],reminders:[],growth:[]};
let s=Object.assign({},D,JSON.parse(localStorage.getItem(K)||"{}"));
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>localStorage.setItem(K,JSON.stringify(s));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function p(){return s.profiles.find(x=>x.id===s.active)||null}
function age(d){if(!d)return"";const a=new Date(d),n=new Date();let m=(n.getFullYear()-a.getFullYear())*12+n.getMonth()-a.getMonth();return m<24?m+" mois":Math.floor(m/12)+" ans"}
const mods=[["feeding","🍼","Alimentation"],["sleep","🌙","Sommeil"],["diapers","🧷","Couches"],["growth","📈","Croissance"],["appointments","🩺","Rendez-vous"],["vaccines","💉","Vaccins"],["reminders","🔔","Rappels"],["calendar","📅","Calendrier"],["settings","⚙️","Réglages"]];
function nav(active="home"){return '<div class="bottom">'+[["home","⌂","Accueil"],["calendar","📅","Calendrier"],["feeding","＋","Suivi"],["reminders","🔔","Rappels"],["settings","⚙️","Réglages"]].map(x=>'<button class="'+(active===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span><small>'+x[2]+'</small></button>').join("")+'</div>'}
function go(x){s.screen=x;save();render()}
function profileCard(){const c=p();return c?'<div class="card profile" onclick="go(\'profile\')"><div class="avatar">'+(c.avatar||"👶")+'</div><div class="grow"><b>'+esc(c.name)+'</b><small class="muted">'+age(c.dob)+(c.doctor?" • Dr "+esc(c.doctor):"")+'</small></div><span>›</span></div>':'<div class="card"><b>Aucun profil enfant</b><p class="muted">Crée le premier profil pour activer le suivi.</p><button class="btn primary" onclick="go(\'profile\')">Créer un profil</button></div>'}
function render(){if(s.screen==="home")home();else if(s.screen==="profile")profile();else if(s.screen==="calendar")calendar();else if(s.screen==="settings")settings();else module(s.screen)}
function home(){const c=p(),today=new Date().toDateString(),ev=s.events.filter(e=>e.profileId===s.active&&new Date(e.ts).toDateString()===today);app.innerHTML='<div class="top"><div class="brand">Naël</div><button class="btn ghost" onclick="go(\'settings\')">⚙️</button></div><div class="sub">Grandir ensemble • Grossesse • Bébé • Parentalité</div><div class="card hero"><h2>'+(c?"Bonjour, "+esc(c.name)+" ✨":"Bienvenue dans Naël ✨")+'</h2><p class="muted">Le suivi parental doux et pratique au quotidien.</p></div>'+profileCard()+(c?'<div class="stats"><div class="card stat"><strong>'+ev.filter(e=>e.type==="feeding").length+'</strong><small>Repas</small></div><div class="card stat"><strong>'+ev.filter(e=>e.type==="sleep").length+'</strong><small>Sommeils</small></div><div class="card stat"><strong>'+ev.filter(e=>e.type==="diapers").length+'</strong><small>Couches</small></div></div>':"")+'<h3>Outils</h3><div class="grid">'+mods.map(m=>'<div class="card mod" onclick="go(\''+m[0]+'\')"><div><b>'+m[1]+'</b><span>'+m[2]+'</span></div></div>').join("")+'</div>'+nav("home")}
function profile(){const c=p()||{};app.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Retour</button><h1 class="title">Profil enfant</h1><div class="card"><div class="field"><label>Prénom</label><input id="pn" value="'+attr(c.name||"")+'"></div><div class="field"><label>Date de naissance</label><input id="pd" type="date" value="'+attr(c.dob||"")+'"></div><div class="field"><label>Avatar</label><select id="pa">'+["👶","🧸","🐰","🦁","🐼","🌙","⭐"].map(a=>'<option '+(c.avatar===a?"selected":"")+'>'+a+'</option>').join("")+'</select></div><div class="field"><label>Poids naissance (kg)</label><input id="pw" inputmode="decimal" value="'+attr(c.birthWeight||"")+'"></div><div class="field"><label>Taille naissance (cm)</label><input id="ph" inputmode="decimal" value="'+attr(c.birthHeight||"")+'"></div><div class="field"><label>Allergies / infos importantes</label><textarea id="pi">'+esc(c.info||"")+'</textarea></div><div class="field"><label>Pédiatre / médecin</label><input id="pdoc" value="'+attr(c.doctor||"")+'"></div><div class="row"><button class="btn primary" onclick="saveProfile()">Enregistrer</button>'+(c.id?'<button class="btn danger" onclick="deleteProfile()">Supprimer</button>':"")+'</div></div>'+nav()}
function saveProfile(){const name=$("pn").value.trim();if(!name)return toast("Prénom requis");let c=p();if(!c){c={id:uid()};s.profiles.push(c);s.active=c.id}Object.assign(c,{name,dob:$("pd").value,avatar:$("pa").value,birthWeight:$("pw").value,birthHeight:$("ph").value,info:$("pi").value.trim(),doctor:$("pdoc").value.trim()});save();toast("Profil enregistré ✓");go("home")}
function deleteProfile(){if(!confirm("Supprimer ce profil ?"))return;const id=s.active;s.profiles=s.profiles.filter(x=>x.id!==id);["events","appointments","vaccines","reminders","growth"].forEach(k=>s[k]=s[k].filter(x=>x.profileId!==id));s.active=s.profiles[0]?.id||null;save();go("home")}
function need(){if(!p()){toast("Crée d’abord un profil enfant");go("profile");return false}return true}
function module(k){if(!need())return;const c=p();let body="";
if(k==="feeding")body=formEvent("feeding","Alimentation","Type","feedType",["Biberon","Allaitement","Solides"],"Quantité (ml)","amount");
if(k==="sleep")body='<div class="card"><div class="field"><label>Début</label><input id="start" type="datetime-local"></div><div class="field"><label>Fin</label><input id="end" type="datetime-local"></div><div class="field"><label>Note</label><textarea id="note"></textarea></div><button class="btn primary" onclick="addSleep()">Enregistrer</button></div>'+history(k);
if(k==="diapers")body=formEvent("diapers","Couches","Type","kind",["Pipi","Caca","Mixte"],"Note","note");
if(k==="growth")body='<div class="card"><div class="row"><div class="field grow"><label>Poids kg</label><input id="weight" inputmode="decimal"></div><div class="field grow"><label>Taille cm</label><input id="height" inputmode="decimal"></div></div><button class="btn primary" onclick="addGrowth()">Ajouter</button></div>'+growthView();
if(k==="appointments")body=appointmentView();
if(k==="vaccines")body=vaccineView();
if(k==="reminders")body=reminderView();
app.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Retour</button><h1 class="title">'+(mods.find(x=>x[0]===k)?.[2]||k)+'</h1><div class="muted">'+esc(c.name)+'</div>'+body+nav(k)}
function formEvent(type,title,l1,id1,opts,l2,id2){return '<div class="card"><div class="field"><label>'+l1+'</label><select id="'+id1+'">'+opts.map(o=>'<option>'+o+'</option>').join("")+'</select></div><div class="field"><label>'+l2+'</label><input id="'+id2+'"></div><button class="btn primary" onclick="addSimple(\''+type+'\',\''+id1+'\',\''+id2+'\')">Enregistrer</button></div>'+history(type)}
function addSimple(type,a,b){s.events.push({id:uid(),profileId:s.active,type,kind:$(a).value,note:$(b).value,ts:new Date().toISOString()});save();toast("Ajouté ✓");module(type)}
function addSleep(){const a=$("start").value,b=$("end").value;if(!a||!b)return toast("Début et fin requis");const d=Math.round((new Date(b)-new Date(a))/60000);if(d<=0)return toast("Heures invalides");s.events.push({id:uid(),profileId:s.active,type:"sleep",duration:d,note:$("note").value,ts:new Date(b).toISOString()});save();toast("Sommeil enregistré ✓");module("sleep")}
function history(type){const a=s.events.filter(e=>e.profileId===s.active&&e.type===type).slice().reverse();return '<div class="card">'+(a.length?a.map(e=>'<div class="list"><b>'+new Date(e.ts).toLocaleString("fr-FR")+'</b><small>'+(e.duration?e.duration+" min • ":"")+(e.kind?esc(e.kind)+" • ":"")+esc(e.note||"")+'</small></div>').join(""):'<div class="empty">Aucun historique</div>')+'</div>'}
function addGrowth(){s.growth.push({id:uid(),profileId:s.active,weight:+$("weight").value||null,height:+$("height").value||null,ts:new Date().toISOString()});save();module("growth")}
function growthView(){const a=s.growth.filter(x=>x.profileId===s.active).slice(-8),mx=Math.max(1,...a.map(x=>x.weight||0));return '<div class="card"><b>Évolution du poids</b><div class="chart">'+a.map(x=>'<div class="bar" title="'+x.weight+' kg" style="height:'+Math.max(5,(x.weight||0)/mx*140)+'px"></div>').join("")+'</div>'+(!a.length?'<div class="empty">Ajoute une première mesure.</div>':a.map(x=>'<div class="list"><b>'+new Date(x.ts).toLocaleDateString("fr-FR")+'</b><small>'+(x.weight||"—")+" kg • "+(x.height||"—")+" cm</small></div>').join(""))+'</div>'}
function appointmentView(){const a=s.appointments.filter(x=>x.profileId===s.active).sort((x,y)=>x.date.localeCompare(y.date));return '<div class="card"><div class="field"><label>Objet</label><input id="apt"></div><div class="field"><label>Date et heure</label><input id="apd" type="datetime-local"></div><div class="field"><label>Note</label><textarea id="apn"></textarea></div><button class="btn primary" onclick="addAppointment()">Ajouter</button></div><div class="card">'+(a.length?a.map(x=>'<div class="list"><b>'+esc(x.title)+'</b><small>'+new Date(x.date).toLocaleString("fr-FR")+' • '+esc(x.note||"")+'</small></div>').join(""):'<div class="empty">Aucun rendez-vous</div>')+'</div>'}
function addAppointment(){if(!$("apt").value||!$("apd").value)return toast("Objet et date requis");const id=uid(),date=$("apd").value;s.appointments.push({id,profileId:s.active,title:$("apt").value,date,note:$("apn").value});s.reminders.push({id:uid(),profileId:s.active,title:"Rendez-vous : "+$("apt").value,when:new Date(date).toISOString(),done:false});save();module("appointments")}
function vaccineView(){const a=s.vaccines.filter(x=>x.profileId===s.active);return '<div class="card"><div class="field"><label>Vaccin / rappel</label><input id="vn"></div><div class="field"><label>Date</label><input id="vd" type="date"></div><button class="btn primary" onclick="addVaccine()">Ajouter</button></div><div class="card">'+(a.length?a.map(x=>'<div class="list"><b>'+esc(x.name)+'</b><small>'+esc(x.date||"Date non définie")+' • '+(x.done?"Fait":"À faire")+'</small><button class="btn ghost" onclick="doneVaccine(\''+x.id+'\')">✓ Fait</button></div>').join(""):'<div class="empty">Aucun vaccin enregistré</div>')+'</div>'}
function addVaccine(){if(!$("vn").value)return toast("Nom requis");s.vaccines.push({id:uid(),profileId:s.active,name:$("vn").value,date:$("vd").value,done:false});save();module("vaccines")}function doneVaccine(id){const v=s.vaccines.find(x=>x.id===id);if(v)v.done=true;save();module("vaccines")}
function reminderView(){const a=s.reminders.filter(x=>x.profileId===s.active).sort((x,y)=>x.when.localeCompare(y.when));return '<div class="card"><div class="field"><label>Rappel</label><input id="rn"></div><div class="field"><label>Date et heure</label><input id="rd" type="datetime-local"></div><button class="btn primary" onclick="addReminder()">Ajouter</button></div><div class="card">'+(a.length?a.map(x=>'<div class="list"><b>'+esc(x.title)+'</b><small>'+new Date(x.when).toLocaleString("fr-FR")+' • '+(x.done?"Terminé":"À venir")+'</small></div>').join(""):'<div class="empty">Aucun rappel</div>')+'</div>'}
function addReminder(){if(!$("rn").value||!$("rd").value)return toast("Titre et date requis");s.reminders.push({id:uid(),profileId:s.active,title:$("rn").value,when:new Date($("rd").value).toISOString(),done:false});save();module("reminders")}
function calendar(){if(!need())return;const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7;let cells="";for(let i=0;i<start;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const key=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),cnt=s.appointments.filter(x=>x.profileId===s.active&&x.date.startsWith(key)).length+s.vaccines.filter(x=>x.profileId===s.active&&x.date===key).length+s.reminders.filter(x=>x.profileId===s.active&&x.when.startsWith(key)).length;cells+='<div class="day '+(d===n.getDate()?"today":"")+'"><b>'+d+'</b><div>'+Array(cnt).fill('<span class="dot"></span>').join("")+'</div></div>'}app.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Retour</button><h1 class="title">Calendrier</h1><div class="card"><div class="calendar">'+["L","M","M","J","V","S","D"].map(x=>'<b style="text-align:center">'+x+'</b>').join("")+cells+'</div></div>'+nav("calendar")}
function settings(){const count=s.profiles.length;app.innerHTML='<button class="btn ghost" onclick="go(\'home\')">← Retour</button><h1 class="title">Réglages</h1><div class="card"><b>Naël V0.5</b><p class="muted">Données locales sur cet appareil • '+count+' profil(s)</p><div class="row"><button class="btn ghost" onclick="exportData()">Exporter JSON</button><button class="btn danger" onclick="resetAll()">Réinitialiser</button></div></div><div class="card"><b>Confidentialité</b><p class="muted">Cette version stocke les données uniquement dans le navigateur. Les informations de santé servent à l’organisation et ne remplacent pas un professionnel de santé.</p></div>'+nav("settings")}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="nael-backup.json";a.click()}function resetAll(){if(confirm("Tout supprimer ?")){localStorage.removeItem(K);s=JSON.parse(JSON.stringify(D));render()}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function attr(v){return esc(v)}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));render();
</script></body></html>
